<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" font-family="Helvetica, Arial, sans-serif">
  <rect width="375" height="812" rx="36" fill="#fafaf9"/>
  <rect x="4" y="4" width="367" height="804" rx="32" fill="#ffffff" stroke="#e7e5e4" stroke-width="2"/>

  <!-- status bar -->
  <text x="30" y="38" font-size="14" fill="#1c1917" font-weight="600">9:41</text>
  <text x="345" y="38" font-size="14" fill="#1c1917" text-anchor="end">100%</text>

  <!-- simulated-data banner -->
  <rect x="24" y="56" width="220" height="26" rx="13" fill="#fde68a"/>
  <text x="36" y="73" font-size="11" fill="#78350f" font-weight="700">DATO SIMULADO — demostración</text>

  <!-- live location card -->
  <rect x="24" y="96" width="327" height="150" rx="16" fill="#f1f5f9" stroke="#e2e8f0"/>
  <circle cx="187" cy="171" r="10" fill="#2563eb"/>
  <circle cx="187" cy="171" r="20" fill="#2563eb" fill-opacity="0.2"/>
  <text x="187" y="222" font-size="12" fill="#475569" text-anchor="middle">Ubicación en vivo — Iztapalapa, CDMX</text>

  <!-- sensor status -->
  <rect x="24" y="262" width="327" height="92" rx="16" fill="#ffffff" stroke="#e7e5e4" stroke-width="2"/>
  <circle cx="46" cy="290" r="6" fill="#16a34a"/>
  <text x="62" y="295" font-size="14" fill="#1c1917" font-weight="700">Sensor activo — dato simulado</text>
  <text x="46" y="318" font-size="12" fill="#57534e">Confianza del sistema:</text>
  <rect x="176" y="306" width="46" height="20" rx="10" fill="#fef3c7"/>
  <text x="199" y="320" font-size="11" fill="#92400e" font-weight="700" text-anchor="middle">Media</text>
  <text x="46" y="340" font-size="11" fill="#a8a29e">No detecta todos los casos — ver límites de validación</text>

  <!-- SOS button -->
  <circle cx="187" cy="470" r="86" fill="#dc2626"/>
  <circle cx="187" cy="470" r="86" fill="none" stroke="#fecaca" stroke-width="8"/>
  <text x="187" y="482" font-size="40" fill="#ffffff" font-weight="800" text-anchor="middle">SOS</text>
  <text x="187" y="582" font-size="12" fill="#78716c" text-anchor="middle">Sin registro de placa ni ruta.</text>
  <text x="187" y="600" font-size="12" fill="#78716c" text-anchor="middle">Un toque activa la alerta.</text>

  <!-- footer / shadow clause -->
  <line x1="24" y1="700" x2="351" y2="700" stroke="#e7e5e4" stroke-width="1"/>
  <text x="24" y="726" font-size="11" fill="#78716c">Dueño institucional:</text>
  <text x="24" y="742" font-size="12" fill="#1c1917" font-weight="700">Unidad Piloto de Movilidad Segura (simulado)</text>
  <text x="24" y="766" font-size="12" fill="#2563eb" text-decoration="underline">Ver dashboard público →</text>
</svg>
